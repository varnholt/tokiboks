<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">tokiboks: tap a card, play an album</title><desc id="desc">An RFID card connects to the ESP32 through an MFRC522 reader. The ESP32 sends playback requests over Wi-Fi to a Python and mpv player on a Raspberry Pi or computer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#a6c6a0"/></marker></defs>
<rect width="1200" height="600" rx="20" fill="#14201b"/>
<g font-family="Segoe UI,Arial,sans-serif"><text x="65" y="76" fill="#afd7aa" font-size="18" letter-spacing="4">TOKIBOKS</text><text x="65" y="138" fill="#f2f5e9" font-size="46" font-weight="600">Tap a card. Play an album.</text>
<g fill="#22392e" stroke="#50715b" stroke-width="2"><rect x="65" y="210" width="260" height="220" rx="16"/><rect x="470" y="210" width="260" height="220" rx="16"/><rect x="875" y="210" width="260" height="220" rx="16"/></g>
<g stroke="#a6c6a0" stroke-width="3" marker-end="url(#arrow)"><path d="M345 320h100"/><path d="M750 320h100"/></g>
<g text-anchor="middle"><g fill="#c8e6bc" font-size="17"><text x="195" y="255">01 / CHOOSE</text><text x="600" y="255">02 / READ</text><text x="1005" y="255">03 / LISTEN</text></g><g fill="#f2f5e9" font-size="29" font-weight="600"><text x="195" y="321">RFID card</text><text x="600" y="321">ESP32</text><text x="1005" y="321">Python + mpv</text></g><g fill="#b4c7b9" font-size="18"><text x="195" y="366">One card per album</text><text x="600" y="366">MFRC522 + Wi-Fi</text><text x="1005" y="366">Raspberry Pi / computer</text></g><text x="802" y="296" fill="#b4c7b9" font-size="15">HTTP</text></g>
<g><circle cx="88" cy="500" r="12" fill="#598bdd"/><circle cx="126" cy="500" r="12" fill="#d36161"/><circle cx="164" cy="500" r="12" fill="#edca62"/><circle cx="202" cy="500" r="12" fill="#71b87b"/><text x="237" y="507" fill="#d1dfd2" font-size="20">Pause · Previous · Next · Sleep</text><text x="65" y="553" fill="#97b09f" font-size="16">System overview · RFID and buttons on the ESP32; audio playback on the host</text></g></g></svg>
